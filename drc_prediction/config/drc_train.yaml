gpu: 0
dataroot: ./training_set/DRC
save_path: ./work_dirs/RouteNet_N28

# Train
max_iters: 200000
ann_file_train: ./files/train_N28.csv
model_type: RouteNet
batch_size: 8
in_channels: 9
out_channels: 1
lr: 2e-4
weight_decay: 1e-4
loss_type: MSELoss
threshold: 0.1
eval_metric:
  - NRMS
  - SSIM
save_freq: 10000

# Test
ann_file_test: ./files/test_N28.csv
plot_roc: True


